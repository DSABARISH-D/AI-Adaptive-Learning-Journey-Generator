services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: adaptive-learning-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: adaptive_learning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adaptive_learning"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adaptive-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adaptive-learning-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/adaptive_learning
      - JWT_SECRET=dev-secret-key-change-in-production
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173
      - LLM_PROVIDER=google
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - OAUTH_REDIRECT_URL=http://localhost:3000/login
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - adaptive-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adaptive-learning-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - adaptive-net

volumes:
  postgres_data:

networks:
  adaptive-net:
    driver: bridge
